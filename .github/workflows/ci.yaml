name: CI

on:
  workflow_dispatch:

  push:
    branches: [ master ]

  pull_request:
    branches: [ master ]


env:
  GO_VERSION: "1.25"


jobs:

  gofmt:
    name: Go Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check formatting
        run: |
          files=$(gofmt -l .)

          if [ -n "$files" ]; then
            echo "Following files are not formatted:"
            echo "$files"
            exit 1
          fi


  go-test:
    name: Go Test
    runs-on: ubuntu-latest

    needs:
      - gofmt

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true


      - name: Download dependencies
        run: go mod download


      - name: Run tests
        run: go test ./...


  go-vet:
    name: Go Vet
    runs-on: ubuntu-latest

    needs:
      - gofmt

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}


      - name: Download dependencies
        run: go mod download


      - name: Run go vet
        run: go vet ./...



  golangci-lint:
    name: GolangCI Lint
    runs-on: ubuntu-latest

    needs:
      - gofmt

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest



  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    needs:
      - go-test
      - go-vet
      - golangci-lint


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: rzhaka-tournaments:test