syntax = "proto3";

package apex;

option go_package = "github.com/rzhaka-turiki/rzhaka_tournaments/internal/client/apexverifier/proto/apexpb;apexpb";

service ApexVerifier {
  rpc VerifyAccount(VerifyAccountRequest) returns (VerifyAccountResponse);
}

message VerifyAccountRequest {
  string player = 1;
  string platform = 2;
  int32 level = 3;
}

message VerifyAccountResponse {
  string uid = 1;
  string player = 2;
  string platform = 3;
  int32 level = 4;
}